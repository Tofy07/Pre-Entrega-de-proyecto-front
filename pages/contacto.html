<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Formulario deContacto</title>
</head>
<body>
    <header>
        <div class="div-logo">
            <a class="logo" href="../index.html">LOGO</a>
        </div>

        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/contacto.html">Contacto</a></li>
                <li><a href="../pages/carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contacto</h1>
        <p class="parrafo">¡Contáctanos! Estamos aquí para ayudarte.</p>

        <form class="formulario-contacto" action="mailto:gschacafernandez@gmail.com" method="post" enctype="text/plain">
            <div class="campo-formulario">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
            </div>

            <div class="campo-formulario">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
            </div>

            <div class="campo-formulario">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
            </div>

            <button type="submit" class="btn bg-secondary text-dark">Enviar mensaje</button>
        </form>
    </main>
    <footer>
        <p> © 2026 Mi Tienda. Todos los derechos reservados.</p>
        <nav>
            <ul>
                <li><a href="#"><img src="../img/WhatsApp_icon.png" alt="logo-WhatsApp"></a></li>
                <li><a href="#"><img src="../img/Facebook_logo_(square).png" alt="logo-Facebook"></a></li>
                <li><a href="#"><img src="../img/Instagram.png" alt="logo-Instagram"></a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
